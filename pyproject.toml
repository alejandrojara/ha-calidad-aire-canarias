[project]
name = "ha-calidad-aire-canarias"
version = "20261120.1"
description = "Unofficial Home Assistant custom integration for the Canary Islands Government Air Quality API (ICA & station sensors)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning:homeassistant.*",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "B",
    "C4",
    "E",
    "F",
    "I",
    "N",
    "SIM",
    "UP",
    "W",
]
ignore = [
    "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.calidad_aire_canarias"]
force-sort-within-sections = true

[tool.mypy]
python_version = "3.14"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
